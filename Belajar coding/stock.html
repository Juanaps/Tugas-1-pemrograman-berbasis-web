<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Stok - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <a href="dashboard.html"><img src="img/ut.png" alt="Logo UT" style="max-height: 45px;"></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="stock.html" style="color: #F4A21D;">Info Bahan Ajar</a></li>
                <li><a href="tracking.html">Lacak Pengiriman</a></li>
                <li class="dropdown">
                    <div><a href="javascript:void(0)">Laporan <i class="fa-solid fa-angle-down"></i></a></div>
                    <div class="dropdown-menu">
                        <a href="#">Progress DO</a>
                        <a href="#">Rekap Stok</a>
                    </div>
                </li>
                <li><a href="#">Riwayat Transaksi</a></li>
                <li><a href="javascript:void(0)" id="logoutBtn" class="btn-logout">Keluar</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <h2>Daftar Ketersediaan Bahan Ajar</h2>
        
        <div class="data-table-wrapper">
            <table id="tabelStok">
                <thead>
                    <tr>
                        <th>Kode Modul</th>
                        <th>Judul Mata Kuliah</th>
                        <th>Jumlah Stok</th>
                        <th>Kode Gudang</th>
                        <th>Aksi / Pratinjau</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data tabel akan diisi otomatis oleh JavaScript -->
                </tbody>
            </table>
        </div>
    
        <div class="form-card" style="margin-top: 40px;">
            <h2 style="margin-top: 0; text-align: left; font-size: 20px;">Registrasi Bahan Ajar Baru</h2>
            <form id="formTambah">
                <input type="text" id="kode" placeholder="Kode Barang (Contoh: ASIP1234)" required>
                <input type="text" id="nama" placeholder="Judul Buku / Nama Mata Kuliah" required>
                <input type="number" id="stok" placeholder="Kuantitas (Jumlah)" required>
                <input type="text" id="lokasi" placeholder="Gudang Penyimpanan (Contoh: 0JKT01)" required>
                <label for="cover" style="font-size: 12px; color: #64748B; margin-left: 5px;">Unggah Sampul Buku (Opsional):</label>
                <input type="file" id="cover" style="border: none; padding-left: 0;">
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Simpan ke Basis Data</button>
            </form>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
